name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

env:
  # RTCamNative pulls FFmpeg (LGPL) via vcpkg; cache built packages in the GitHub
  # Actions cache (first run pays the ~30 min FFmpeg build, later runs restore it).
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # git describe ha bisogno della storia completa per il versioning
          submodules: recursive # external/vcpkg is a submodule; required for the FFmpeg engine

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v1.0.2

      - name: Bootstrap vcpkg
        shell: cmd
        run: .\external\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Export GitHub Actions cache env for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Restore NuGet packages
        run: nuget restore RTVirtualCamera.sln

      - name: Build
        run: msbuild /m /p:Configuration=Release /p:Platform=x64 RTVirtualCamera.sln

      - name: Find MSI
        id: msi
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Recurse -Filter 'RT-VirtualCam-Setup.msi' | Select-Object -First 1
          if (-not $msi) { throw 'MSI non trovato dopo la build' }
          "path=$($msi.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Extract changelog section
        id: changelog
        uses: mindsers/changelog-reader-action@v2
        with:
          version: ${{ github.ref_name }}
          path: CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.msi.outputs.path }}
          body: ${{ steps.changelog.outputs.changes }}
